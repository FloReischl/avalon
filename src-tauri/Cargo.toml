[package]
name = "avalon"
version = "0.1.0"
description = "Avalon local desktop companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = ["image-png"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-opener = "2.5.5"

x11rb = { version = "=0.14.0", features = ["shape"] }
