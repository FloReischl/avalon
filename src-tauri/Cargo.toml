[package]
name = "avalo"
version = "0.1.0"
description = "Avalo local desktop companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
x11rb = { version = "=0.14.0", features = ["shape"] }
