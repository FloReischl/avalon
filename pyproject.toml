[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avalo-backend"
version = "0.1.0"
description = "Local backend for Avalo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "setuptools>=75,<81",
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-httpx>=0.20,<1",
    "pytest-asyncio>=0.20,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/backend", "tests/integration"]
markers = [
    "integration: tests requiring explicitly available local services or hardware",
]
