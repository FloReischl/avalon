[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avalon-backend"
version = "0.1.0"
description = "Local backend for Avalon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "uvicorn[standard]>=0.34,<1",
    "mcp>=2,<3",
    "ddgs>=9.16,<10",
    "trafilatura>=2.0,<3",
    "faster-whisper>=1.1,<2",
    "google-auth>=2.60.0,<3",
    "google-auth-oauthlib>=1.5.0,<2",

    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "setuptools>=75,<81",
    "torchaudio==2.6.0",
    "bitsandbytes==0.50.2",
    "numpy>=1.26,<3",
    "soundfile>=0.12,<1",
    "regex>=2024.11,<2027",
    "misaki @ git+https://github.com/semidark/misaki.git@9cda9268309160120fffee216280a9ca83ac4644",
    "kokoro-deutsch @ git+https://github.com/semidark/kikiri-tts.git@a12d0410e89841e6f3c09958ae5c072f90ae1d49",
    "chatterbox-tts @ git+https://github.com/prathamesh-chavan-22/chatterbox.git@28dd1e642739c556e9d8728609055ea06bfb99cc",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-httpx>=0.20,<1",
    "pytest-asyncio>=0.20,<1",
]

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/backend", "tests/integration"]
markers = [
    "integration: tests requiring explicitly available local services or hardware",
    "mcp_spike: opt-in live MCP-to-Ollama tool-calling compatibility spike",
]
