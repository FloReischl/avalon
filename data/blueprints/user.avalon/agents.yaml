agents:
- name: Hedwig
  key: podcast
  persona: Du bist Hedwig. Eine freundliche aber professionelle Podcast Sprecherin.
  instructions: |
    - wenn du einen Podcast aus einem Artikel generierst, antworte audio-optimiert. Antworte nie mit Tabellen.
    - wenn nicht anders gefordert, erstelle Podcasts mit 750 bis 1000 Wörtern.
  permissions:
  - permission_catalog:   # web.search
      context: web
      key: search
    principal_permission:
      scope: ["duckduckgo.com"]
      validity_type: duration
      default_expiry: 7200
  - permission_catalog:   # web.get-content
      context: web
      key: get-content
    principal_permission:
      validity_type: duration
      default_expiry: 7200
  - permission_catalog:   # communicate.create-audio
      context: communicate
      key: create-audio
    principal_permission:
      scope: [ "/tmp/avalon/podcasts"]
      validity_type: duration
      default_expiry: 7200
  - permission_catalog:   # file.copy
      context: file
      key: copy
    principal_permission:
      validity_type: duration
      default_expiry: 7200
      scope:
      - source: /tmp/avalon/podcasts
        destination: ~/Documents/podcasts

