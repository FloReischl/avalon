name: Frieda
chat:
  principal_key: chat-default
  permissions:
  - permission_catalog:   # web.search
      context: web
      key: search
    principal_permission:
      scope: ["duckduckgo.com"]
      validity_type: duration
      default_expiry: 36000
  - permission_catalog:   # web.get-content
      context: web
      key: get-content
    principal_permission:
      validity_type: duration
      default_expiry: 36000
tts:
  chatterbox:
    reference_audio: data/tts/chatterbox/frieda1.wav
  kokoro:
    model: data/tts/kokoro_victoria/kikiri_german_victoria_ep10.pth
    voice: data/tts/kokoro_victoria/victoria.pt
    config: data/tts/kokoro_victoria/config.json
