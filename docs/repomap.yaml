schema_version: 1

project:
  name: avalo
  purpose: local desktop companion with text chat, native Gemma audio input, and local TTS
  repomap_role: >
    Persistent working index for Frieda. Used for impact analysis,
    implementation planning, dependency navigation, and selecting source files
    that must be inspected before generating changes.
  authority: source_code
  update_policy: >
    Update only from final accepted implementation state. Re-analyze repository
    when structural changes or accumulated drift make incremental maintenance unreliable.

architecture:
  desktop:
    target: Tauri
    status: implemented_foundation
    responsibility:
      - transparent avatar desktop shell
      - normal chat desktop window
      - backend process lifecycle
      - native desktop input shaping
    windows:
      main:
        role: avatar companion window
        always_on_top: true
        decorations: false
        transparent: true
        close_behavior: exit_application
      chat:
        role: main chat window
        initially_visible: false
        decorations: true
        resizable: true
        close_behavior: hide
    notes:
      - Vue runs in Tauri webviews.
      - Python backend remains a separate local process.
      - Tauri starts, monitors, and stops the backend process it owns.
      - Backend readiness and startup diagnostics are exposed to the frontend.
      - Double-clicking the avatar shows and focuses the existing chat window.
      - Closing the avatar window exits the application and stops the owned backend process.
      - Closing the chat window hides it instead of destroying its webview state.
      - Explicit chat-window geometry persistence is not implemented.
      - Current desktop input shaping is implemented for X11 using native SHAPE input regions.
      - Avatar input regions are generated from the rendered PNG alpha channel.

  frontend:
    technology:
      - Vue 3
      - TypeScript
      - Vite
    root: frontend
    status: implemented_foundation
    communicates_with: backend_http_api
    window_roots:
      main: frontend/src/App.vue
      chat: frontend/src/ChatWindow.vue

  backend:
    technology:
      - Python
      - FastAPI
    root: backend/app
    status: partial
    layers:
      api: HTTP endpoints and public schemas
      application: use-case orchestration
      runtime: interchangeable local model adapters
      audio: backend-local audio capture and preparation boundary
      tts: interchangeable speech synthesis adapters
      config: central technical configuration

  communication:
    backend_address: "127.0.0.1:8095"
    transport: HTTP
    request_format: JSON
    streaming_response: SSE_with_JSON_data
    authentication: none
    scope: loopback_only

  conversation:
    persistence: none
    state: transient_frontend_memory
    response_mode: streaming
    current_scope:
      - no persona
      - no memory
      - no persisted history
      - text and audio turns share the same transient conversation context
      - prior audio UI placeholders are excluded from model context
      - active text turn can be aborted and rolled back client-side
      - failed or aborted audio response keeps the visible audio user contribution

key_flows:

  backend_startup:
    entry: backend/app/main.py:create_app
    uses:
      - backend/app/config.py:settings
      - backend/app/api/router.py:api_router
    behavior:
      - creates FastAPI application
      - configures frontend CORS origin
      - installs API router

  health:
    endpoint: "GET /health"
    route: backend/app/api/routes/health.py:health
    schema: backend/app/api/schemas.py:HealthResponse
    uses:
      - backend/app/config.py:settings
    status: implemented
    semantics: backend HTTP readiness only

  text_chat:
    endpoint: "POST /api/v1/chat"
    route: backend/app/api/routes/chat.py:create_chat_response
    request: backend/app/api/schemas.py:ChatRequest
    response_media_type: text/event-stream
    application_service: backend/app/services/chat.py:ChatService.stream_response
    runtime_call: ModelRuntime.generate_text_stream
    status: implemented
    stream_protocol:
      chunk:
        data: '{"text": "<chunk>"}'
      done:
        data: "{}"
      error:
        data: "{}"
    semantics:
      - successful stream emits zero or more chunk events followed by done
      - runtime failure emits error and no done event
      - runtime error details are not exposed in the public stream
      - cancellation propagates through service and runtime without becoming an error event

  native_audio:
      flow:
        - chat-window push-to-talk interaction
        - POST /api/v1/audio/recording/start
        - backend-local microphone capture through PipeWireRecorder
        - POST /api/v1/audio/recording/stop with prior conversation context
        - AudioChatService stops capture and passes WAV plus context to ModelRuntime
        - OllamaRuntime sends prior context plus native audio to /v1/chat/completions
        - model response streams back through Avalo SSE
      capture_location: python_backend
      capture_adapter: backend/app/audio/capture.py:PipeWireRecorder
      application_service: backend/app/services/audio_chat.py:AudioChatService
      status: end_to_end_spike_implemented
      notes:
        - browser/WebView microphone capture via MediaRecorder was rejected after WebKitGTK produced zero-byte chunks
        - backend microphone capture uses PipeWire pw-record
        - frontend push-to-talk controls backend recording lifecycle
        - quick pointer release while backend start is pending is completed after start succeeds
        - pointer cancellation aborts and discards capture
        - reaching the duration limit aborts capture and discards the incomplete audio fragment
        - visible audio user turns use the UI placeholder "🎤 Sprachnachricht"
        - previous audio placeholders are not sent back as semantic model context
        - no transcript is currently retained for previous audio user turns
      constraints:
        max_duration_seconds: 30
        target_sample_rate_hz: 16000
        target_channels: 1
        initial_language: de
        separate_stt: false

  tts:
    contract: backend/app/tts/base.py:TextToSpeech
    candidate_adapter: backend/app/tts/chatterbox.py:ChatterboxTextToSpeech
    target_candidate: Chatterbox Multilingual V3
    status: stub
    priority: after_text_and_native_audio

modules:

  backend/app/config.py:
    role: central backend configuration
    symbols:
      Settings:
        kind: dataclass
        frozen: true
        fields:
          app_name: str
          api_host: str
          api_port: int
          frontend_dev_origin: str
          default_language: str
          audio_max_seconds: int
          ollama_host: str
          ollama_model: str
      settings:
        kind: singleton
        type: Settings
    relevant_to:
      - backend startup
      - health endpoint
      - Ollama runtime
      - audio constraints

  backend/app/main.py:
    role: FastAPI application entry point
    symbols:
      create_app:
        signature: "() -> FastAPI"
      app:
        kind: FastAPI instance
    dependencies:
      - backend/app/api/router.py
      - backend/app/config.py
    relevant_to:
      - backend startup
      - middleware
      - CORS
      - top-level routing

  backend/app/api/router.py:
    role: top-level HTTP router composition
    symbols:
      api_router:
        kind: APIRouter
    routes:
      - health router at root
      - chat router under /api/v1
      - audio recording router under /api/v1
    dependencies:
      - backend/app/api/routes/health.py
      - backend/app/api/routes/chat.py

  backend/app/api/schemas.py:
    role: public backend HTTP contracts
    symbols:
      HealthResponse:
        fields:
          status: literal_ok
          service: str
      ConversationMessage:
        fields:
          role: user_or_assistant
          content: non_empty_str
      ChatRequest:
        fields:
          messages: list[ConversationMessage]
        validation:
          messages_min_length: 1
      AudioResponseRequest:
        fields:
          messages: list[ConversationMessage]
    relevant_to:
      - health API
      - text chat API
      - audio response API
      - frontend/backend conversation contract

  backend/app/api/routes/health.py:
    role: backend readiness endpoint
    symbols:
      health:
        signature: "() -> HealthResponse"
    endpoint: "GET /health"
    dependencies:
      - backend/app/api/schemas.py:HealthResponse
      - backend/app/config.py:settings
    status: implemented

  backend/app/api/routes/chat.py:
    role: text chat HTTP streaming boundary
    symbols:
      get_chat_service:
        role: request-scoped ChatService composition using OllamaRuntime
      format_sse_event:
        role: Avalo SSE event serialization
      stream_chat_response:
        signature: "(service: ChatService, messages: list[dict[str, str]]) -> AsyncIterator[str]"
        role: translate service chunks and runtime failures into Avalo SSE events
      create_chat_response:
        signature: "(request: ChatRequest, service: ChatService) -> StreamingResponse"
    endpoint: "POST /api/v1/chat"
    response_media_type: text/event-stream
    dependencies:
      - backend/app/api/schemas.py:ChatRequest
      - backend/app/services/chat.py:ChatService
      - backend/app/runtime/ollama.py:OllamaRuntime
    status: implemented
    stream_events:
      - chunk
      - done
      - error
    cancellation:
      - asyncio cancellation is not converted to an error event
      - cancellation propagates into ChatService and ModelRuntime

  backend/app/services/chat.py:
    role: text chat use-case boundary
    symbols:
      ChatService:
        constructor: "(runtime: ModelRuntime)"
        methods:
          stream_response:
            signature: "(messages: list[dict[str, str]]) -> AsyncIterator[str]"
    dependencies:
      - backend/app/runtime/base.py:ModelRuntime
    status: implemented
    behavior:
      - delegate complete transient conversation context to configured ModelRuntime
      - remain independent of concrete runtime adapter
    future_scope:
      - no persistence, persona, or memory yet

  backend/app/services/audio_chat.py:
    role: native-audio chat use-case boundary
    symbols:
      AudioChatService:
        role: coordinate microphone capture lifecycle and model response generation
    dependencies:
      - backend/app/audio/capture.py:PipeWireRecorder
      - backend/app/runtime/base.py:ModelRuntime
    behavior:
      - start and abort backend-local recording
      - stop capture and pass WAV plus prior conversation context to runtime
      - stream assistant response
      - clean temporary captured audio after generation
    status: implemented_spike

  backend/app/runtime/base.py:
    role: model runtime abstraction
    symbols:
      ModelRuntime:
        kind: Protocol
        methods:
          health:
            signature: "() -> bool"
            async: true
          generate_text:
            signature: "(message: str) -> str"
            async: true
          generate_text_stream:
            signature: "(messages: list[dict[str, str]]) -> AsyncIterator[str]"
          generate_from_audio:
            signature: "(audio_file: Path) -> str"
            async: true
          generate_from_audio_stream:
            signature: "(audio_file: Path, messages: list[dict[str, str]]) -> AsyncIterator[str]"
    consumers:
      - backend/app/services/chat.py
      - concrete runtime adapters

  backend/app/runtime/ollama.py:
    role: working Ollama runtime adapter used for runtime spike
    symbols:
      OllamaRuntime:
        implements: ModelRuntime
        methods:
          health:
            async: true
            endpoint: "POST /api/show"
            result:
              success: true
              request_or_http_error: false
          generate_text:
            async: true
            endpoint: "POST /api/generate"
            request_streaming: false
            response_contract: "response"
            timeout_seconds: 120
          generate_text_stream:
            kind: async_generator
            endpoint: "POST /v1/chat/completions"
            request_streaming: true
            request_context: full_message_list
            remote_format: OpenAI_compatible_SSE
            yielded_value: non-empty choices[0].delta.content strings
            timeout_seconds: 120
          generate_from_audio:
            async: true
            endpoint: "POST /v1/chat/completions"
            response_contract: "choices[0].message.content"
            audio_encoding: base64_wav
            timeout_seconds: 120
          generate_from_audio_stream:
            kind: async_generator
            endpoint: "POST /v1/chat/completions"
            request_streaming: true
            request_context: prior_messages_plus_current_audio
            remote_format: OpenAI_compatible_SSE
            audio_encoding: base64_wav
            timeout_seconds: 120
    dependencies:
      - backend/app/config.py:settings
      - backend/app/runtime/base.py:ModelRuntime
      - httpx
    status: implemented_spike
    error_semantics:
      remote_errors: RuntimeError
      invalid_remote_response: RuntimeError
      local_audio_file_errors: propagate
      cancellation: propagate
    notes:
      - Complete non-streaming text generation still uses Ollama native /api/generate.
      - Streaming text and native-audio chat both use Ollama OpenAI-compatible /v1/chat/completions.
      - Streaming text receives the full transient message context.
      - Audio streaming appends the current native audio input to prior text-compatible context.
      - Streaming cancellation exits the HTTP response and client contexts.
      - Current adapter has passing real Ollama integration coverage for normal streaming.
      - Abort/cancellation is covered deterministically without real Ollama integration.
      - Ollama is a spike implementation; architecture still targets interchangeable runtime.

  backend/app/runtime/llama_cpp.py:
    role: planned llama.cpp runtime adapter
    symbols:
      LlamaCppRuntime:
        methods:
          health: async
          generate_text: async
          generate_from_audio: async
    status: stub
    notes:
      - Preferred target runtime according to current runtime ADR.
      - Runtime spike must establish Gemma 4 native audio feasibility before final adoption.

  backend/app/audio/capture.py:
    role: backend-local microphone capture adapter
    symbols:
      CaptureError:
        kind: RuntimeError
      CapturedAudio:
        kind: frozen_dataclass
        fields:
          path: Path
          duration_seconds: float
          sample_rate_hz: int
          channels: int
      PipeWireRecorder:
        role: single push-to-talk capture lifecycle through pw-record
        methods:
          start:
            async: true
          stop:
            signature: "() -> CapturedAudio"
            async: true
          abort:
            async: true
      inspect_wav:
        signature: "(path: Path) -> CapturedAudio"
    dependencies:
      - PipeWire pw-record
      - backend/app/config.py:settings.audio_max_seconds
    behavior:
      - only one recording may be active per recorder
      - stop terminates pw-record with SIGINT and validates resulting WAV metadata
      - abort terminates capture and removes the temporary WAV
      - duration timeout aborts and discards the incomplete recording
      - invalid or failed captures are removed
      - hung process shutdown escalates from SIGINT to kill after 2 seconds
    status: implemented_spike

  backend/app/audio/input.py:
    role: native audio normalization and validation boundary
    symbols:
      PreparedAudio:
        kind: dataclass
        frozen: true
        fields:
          path: Path
          duration_seconds: float
          sample_rate_hz:
            type: int
            default: 16000
          channels:
            type: int
            default: 1
      AudioInputPreparer:
        kind: Protocol
        methods:
          prepare:
            signature: "(source: Path) -> PreparedAudio"
            async: true
    status: contract_only
    expected_constraints:
      - maximum 30 seconds
      - 16 kHz
      - mono

  backend/app/tts/base.py:
    role: runtime-independent TTS abstraction
    symbols:
      TextToSpeech:
        kind: Protocol
        methods:
          synthesize:
            signature: "(text: str) -> Path"
            async: true
    status: contract_only

  backend/app/tts/chatterbox.py:
    role: planned Chatterbox TTS adapter
    symbols:
      ChatterboxTextToSpeech:
        methods:
          synthesize:
            signature: "(text: str) -> Path"
            async: true
    status: stub
    dependencies:
      - backend/app/tts/base.py:TextToSpeech
    notes:
      - Chatterbox Multilingual V3 is candidate pending dedicated spike.

  frontend/src/main.ts:
    role: Vue application bootstrap and Tauri window-root selector
    behavior:
      - mounts ChatWindow.vue for Tauri window label chat
      - mounts App.vue otherwise
      - preserves browser development without requiring a Tauri runtime
    relevant_to:
      - frontend startup
      - desktop window composition
      - App.vue
      - ChatWindow.vue
      - global styles

  frontend/src/App.vue:
    role: avatar companion root UI component
    status: implemented_foundation
    relevant_to:
      - backend startup diagnostics
      - avatar rendering
      - avatar drag interaction
      - avatar push-to-talk UI
      - audio recording countdown
      - chat-window opening
      - alpha-based avatar hit detection
      - native input-shape generation
      - frontend tests
    dependencies:
      - frontend/src/services/backendLifecycle.ts
      - frontend/src/services/inputShape.ts
      - frontend/src/services/chatWindow.ts
      - frontend/src/services/windowDrag.ts
      - frontend/src/assets/avatars/frieda/standard.png
    interaction:
      - avatar drag starts only after pointer movement crosses a small threshold
      - avatar double-click opens the chat window
      - double-click remains functional after moving the avatar
      - audio button enters recording UI state while pointer is held
      - recording UI resets on pointer release or cancellation
      - recording UI aborts after 30 seconds
      - current frontend audio interaction does not capture microphone data

  frontend/src/ChatWindow.vue:
    role: main chat-window Vue root
    status: implemented_transient_chat
    current_behavior:
      - renders conversation sidebar and current transient chat
      - sends messages through streaming backend client
      - disables input while generation is active
      - switches Send action to Stop during generation
      - New Chat aborts an active turn and clears transient state
      - implements multiline-aware Enter / Shift+Enter / Ctrl+Enter semantics
      - renders user and assistant messages through MarkdownMessage
      - supports icon-based Send, Stop, New Chat, and composer expand/collapse actions
      - expanded composer uses the available chat-main area without replacing the textarea
      - preserves composer content and selection across expand/collapse
      - renders role-specific message actions
      - message Copy writes Markdown source as text/plain and rendered content as text/html when supported
      - message Copy falls back to plain Markdown clipboard text
      - Read aloud, Branch, and Edit actions are visible disabled placeholders
      - keeps user Markdown source editing in a plain monospace textarea
      - supports draggable sidebar splitter with bounded width
      - automatically follows streamed assistant output
      - implements push-to-talk backend recording control
      - shows 30-second recording countdown
      - aborts and discards recording at the duration limit
      - handles pointer release that occurs while backend recording start is still pending
      - renders audio user turns as "🎤 Sprachnachricht"
      - streams audio-triggered assistant responses into the normal conversation
    relevant_to:
      - transient text and audio chat UI
      - conversation sidebar
      - current conversation view
      - Markdown rendering
      - streaming interaction
      - frontend chat tests
    dependencies:
      - frontend/src/composables/useTransientChat.ts
      - frontend/src/components/MarkdownMessage.vue

  frontend/src/services/chatWindow.ts:
    role: frontend Tauri boundary for chat-window lifecycle
    responsibilities:
      - invoke native command that shows and focuses the chat window
    native_counterpart:
      - src-tauri/src/main.rs

  frontend/src/services/windowDrag.ts:
    role: frontend Tauri boundary for avatar-window dragging
    responsibilities:
      - start native drag of the current avatar window
    consumers:
      - frontend/src/App.vue

  frontend/src/services/backend.ts:
    role: frontend HTTP boundary for backend communication
    responsibilities:
      - health calls
      - POST streaming chat requests with conversation messages to /api/v1/chat
      - start backend recording through /api/v1/audio/recording/start
      - abort backend recording through /api/v1/audio/recording/abort
      - stop recording and stream native-audio response through /api/v1/audio/recording/stop
      - parse shared Avalo SSE chunk / done / error events
      - expose AbortSignal cancellation to callers
      - reject malformed or incomplete streams
    relevant_to:
      - backend URL/contracts
      - streaming text chat
      - native-audio recording and response flow
    inspect_before:
      - changing backend API paths
      - changing frontend/backend transport
      - changing public chat stream protocol

  frontend/src/types/chat.ts:
    role: frontend transient chat message types
    symbols:
      ChatMessage:
        fields:
          role: user_or_assistant
          content: str
          kind: optional_text_or_audio
    relevant_to:
      - frontend transient conversation state
      - frontend chat rendering
    inspect_with:
      - frontend/src/composables/useTransientChat.ts
      - frontend/src/ChatWindow.vue

  frontend/src/composables/useTransientChat.ts:
    role: transient client-side chat-turn state machine
    responsibilities:
      - hold current messages and input
      - derive shared model conversation context from transient UI messages
      - exclude prior audio UI placeholders from semantic model context
      - start text and audio backend streaming generation
      - append assistant chunks incrementally
      - disable concurrent generation
      - abort active generation
      - roll back complete text turn on Stop or technical failure
      - keep visible audio user contribution when audio response fails or is stopped
      - restore original text prompt exactly after rollback
      - ignore stale callbacks from superseded turns
    dependencies:
      - frontend/src/services/backend.ts
      - frontend/src/types/chat.ts

  frontend/src/components/MarkdownMessage.vue:
    role: shared Markdown renderer for user and assistant messages
    responsibilities:
      - render standard Markdown with raw HTML disabled
      - render tables, lists, headings, blockquotes, and links
      - syntax-highlight fenced code with highlight.js
      - add Copy action for fenced code
      - expose current rendered message HTML to ChatWindow for multi-format clipboard copy
      - route rendered links through externalLinks service
    dependencies:
      - markdown-it
      - highlight.js
      - frontend/src/services/externalLinks.ts
    security:
      raw_html: disabled

  frontend/src/services/externalLinks.ts:
    role: frontend boundary for opening rendered Markdown links externally
    responsibilities:
      - allow only http, https, mailto, and tel protocols
      - use Tauri opener inside desktop runtime
      - use new browser tab during browser development
    native_dependency:
      - tauri-plugin-opener

  frontend/src/services/backendLifecycle.ts:
    role: Tauri frontend boundary for backend lifecycle state
    responsibilities:
      - retrieve buffered backend startup snapshot
      - subscribe to backend status events
      - subscribe to backend log events
    native_counterpart:
      - src-tauri/src/backend.rs

  frontend/src/services/inputShape.ts:
    role: Tauri frontend boundary for native window input regions
    responsibilities:
      - send generated input rectangles to native Tauri command
    native_counterpart:
      - src-tauri/src/input_shape.rs

  frontend/src/assets/avatars/frieda/standard.png:
    role: current default Frieda avatar
    relevant_to:
      - companion rendering
      - alpha-derived X11 input shape

  src-tauri/src/main.rs:
    role: Tauri desktop application entry point
    responsibilities:
      - manage backend process lifecycle
      - expose backend snapshot command
      - expose native input-region command
      - expose chat-window show/focus command
      - exit application when avatar window is closed
      - hide chat window instead of destroying it on close
      - stop owned backend on application exit
    dependencies:
      - src-tauri/src/backend.rs
      - src-tauri/src/input_shape.rs

  src-tauri/tauri.conf.json:
    role: Tauri desktop window configuration
    windows:
      main:
        role: avatar window
        always_on_top: true
        decorations: false
        transparent: true
      chat:
        role: chat window
        initially_visible: false
        decorations: true
        resizable: true
        min_size: "700x500"
        initial_size: "1100x800"

  src-tauri/src/backend.rs:
    role: Tauri-managed Python backend process lifecycle
    responsibilities:
      - start backend through scripts/start-backend.sh
      - disable uvicorn reload for Tauri-managed process
      - capture backend stdout and stderr
      - poll backend health readiness
      - buffer lifecycle status and diagnostic logs
      - stop owned backend process
    status: implemented

  src-tauri/src/input_shape.rs:
    role: native X11 input-shape adapter
    platform: X11
    mechanism: X11 SHAPE extension input region
    responsibilities:
      - receive frontend-generated input rectangles
      - resolve native Tauri Xlib or XCB window id
      - apply rectangles as native X11 input shape
    status: implemented_spike
    notes:
      - Input rectangles currently represent the rendered avatar alpha mask.
      - Transparent pixels pass pointer input through to windows below Avalo.
      - Other interactive UI regions must later be unioned into the native input shape.

tests:

  tests/backend/test_config.py:
    covers:
      - backend configuration defaults
    inspect_with:
      - backend/app/config.py

  tests/backend/test_health.py:
    covers:
      - health endpoint behavior
    inspect_with:
      - backend/app/api/routes/health.py
      - backend/app/main.py
      - backend/app/config.py

  tests/backend/test_chat_contract.py:
    covers:
      - public SSE text chat API contract
      - chunk ordering and done event
      - runtime failure mapped to error event without done
      - request validation
      - cancellation propagation without SSE error conversion
    inspect_with:
      - backend/app/api/routes/chat.py
      - backend/app/api/schemas.py
      - backend/app/services/chat.py

  tests/backend/test_chat_service.py:
    covers:
      - ChatService streaming delegation
      - runtime chunk ordering
    inspect_with:
      - backend/app/services/chat.py
      - backend/app/runtime/base.py

  tests/backend/test_runtime_blueprint.py:
    covers:
      - ModelRuntime contract / llama.cpp runtime blueprint
    inspect_with:
      - backend/app/runtime/base.py
      - backend/app/runtime/llama_cpp.py

  tests/backend/test_ollama_runtime.py:
    covers:
      - Ollama health behavior
      - complete text generation happy/error paths
      - streaming text generation happy/error paths
      - empty streaming chunks skipped
      - streaming HTTP lifecycle cleanup on cancellation
      - native audio happy/error paths
      - outbound Ollama request contracts
    inspect_with:
      - backend/app/runtime/ollama.py
      - backend/app/config.py
    important_contracts:
      complete_text_response: "response"
      streaming_text_response: "choices[0].delta.content"
      audio_response: "choices[0].message.content"
      streaming_audio_response: "choices[0].delta.content"

  tests/backend/test_audio_capture.py:
    covers:
      - PipeWireRecorder start/stop lifecycle
      - WAV metadata inspection
      - SIGINT exit-code handling
      - explicit abort cleanup
      - duration-limit abort and discard
      - concurrent recording rejection
      - stop without active recording
      - missing pw-record failure cleanup
      - invalid WAV rejection and cleanup
    inspect_with:
      - backend/app/audio/capture.py
      - backend/app/config.py

