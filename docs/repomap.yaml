schema_version: 1

project:
  name: avalo
  purpose: local desktop companion with text chat, native Gemma audio input, and local TTS
  repomap_role: >
    Persistent working index for Frieda. Used for impact analysis,
    implementation planning, dependency navigation, and selecting source files
    that must be inspected before generating changes.
  authority: source_code
  update_policy: >
    Update only from final accepted implementation state. Re-analyze repository
    when structural changes or accumulated drift make incremental maintenance unreliable.

architecture:
  desktop:
    target: Tauri
    status: implemented_foundation
    responsibility:
      - transparent avatar desktop shell
      - normal chat desktop window
      - backend process lifecycle
      - native desktop input shaping
      - native window icons and Linux desktop application identity
    windows:
      main:
        role: avatar companion window
        always_on_top: true
        decorations: false
        transparent: true
        close_behavior: exit_application
      chat:
        role: main chat window
        initially_visible: false
        decorations: true
        resizable: true
        close_behavior: hide
    notes:
      - Vue runs in Tauri webviews.
      - Python backend remains a separate local process.
      - Tauri starts, monitors, and stops the backend process it owns.
      - Backend readiness and startup diagnostics are exposed to the frontend.
      - Double-clicking the avatar shows and focuses the existing chat window.
      - Closing the avatar window exits the application and stops the owned backend process.
      - Closing the chat window hides it instead of destroying its webview state.
      - Explicit chat-window geometry persistence is not implemented.
      - Chat-window runtime state is synchronized to the avatar webview through Tauri events.
      - Current desktop input shaping is implemented for X11 using native SHAPE input regions.
      - Avatar input regions are generated from the rendered PNG alpha channel.
      - Main and chat windows receive the Avalo icon explicitly through Tauri.
      - Cinnamon/X11 application identity is provided by an installed desktop entry matching StartupWMClass Avalo.

  frontend:
    technology:
      - Vue 3
      - TypeScript
      - Vite
    root: frontend
    status: implemented_foundation
    communicates_with: backend_http_api
    window_roots:
      main: frontend/src/App.vue
      chat: frontend/src/ChatWindow.vue

  backend:
    technology:
      - Python
      - FastAPI
    root: backend/app
    status: partial
    layers:
      api: HTTP endpoints and public schemas
      application: use-case orchestration
      persistence: SQLite conversation storage and schema lifecycle
      runtime: interchangeable local model adapters
      audio: backend-local audio capture and preparation boundary
      tts: interchangeable speech synthesis adapters
      config: central technical configuration

  communication:
    backend_address: "127.0.0.1:8095"
    transport: HTTP
    request_format: JSON
    streaming_response: SSE_with_JSON_data
    authentication: none
    scope: loopback_only

  conversation:
    persistence: sqlite
    database_path: "~/.avalo/avalo.sqlite"
    schema_management: alembic
    response_mode: streaming
    current_scope:
      - text chats and completed text messages are persisted
      - application startup always begins with a fresh transient New Chat
      - a transient New Chat is persisted only when its first message is sent
      - persisted chats can be listed and reopened with complete stored history
      - model context for text chat is limited to the most recent 100 persisted messages
      - the effective standard avatar provides persona and instructions for assistant generation
      - persona and instructions are prepended as one system message for text and audio assistant generation
      - transcription and automatic title generation do not receive avatar persona or instructions
      - assistant text is persisted only after successful complete generation
      - aborted or failed partial assistant output is not persisted
      - chat titles start as timestamp-based New titles
      - one automatic title attempt occurs after exactly two complete text roundtrips
      - manual chat titles suppress automatic title generation permanently
      - chats have a persisted pinned flag
      - pinned and unpinned chats remain in backend activity order; frontend separates them for sidebar presentation
      - persisted chats can be manually renamed, pinned/unpinned, physically deleted, and exported as Markdown
      - Markdown export reloads the persisted chat detail before writing so exported content reflects stored chronological messages
      - exported message content is preserved as stored, with H1 role headings and separators only between messages
      - deleting the currently visible persisted chat returns the frontend to an empty transient New Chat state
      - text and audio UI continue to share the visible frontend conversation
      - audio user turns begin as the transient "🎤 Sprachnachricht" placeholder
      - every completed audio turn is independently transcribed through Gemma native audio input
      - successful transcripts replace the audio placeholder, are persisted as normal user text, and become semantic context for later turns
      - failed or aborted transcription leaves the audio placeholder instead of retaining partial transcript text
      - audio assistant responses and transcripts stream and persist independently
      - captured WAV files remain temporary and are deleted only after both audio consumers finish or are cancelled
      - multiple persisted chats may have independent concurrent text streams
      - active text turns survive visible chat switching in frontend memory
      - Stop affects only the currently selected running chat

key_flows:

  backend_startup:
    entry: backend/app/main.py:create_app
    uses:
      - backend/app/config.py:settings
      - backend/app/user_config.py:initialize_user_config
      - backend/app/api/router.py:api_router
      - Alembic migration runner
    behavior:
      - creates FastAPI application
      - loads and validates editable per-user configuration before database migration startup
      - user configuration errors fail backend startup
      - runs database migrations to current Alembic head during application lifespan startup
      - backend startup fails when database initialization or migration fails
      - startup failures write their full traceback to server stderr
      - uncaught request exceptions write their full traceback to server stderr
      - configures frontend CORS origin
      - allows browser frontend GET, POST, PATCH, and DELETE requests
      - installs API router

  health:
    endpoint: "GET /health"
    route: backend/app/api/routes/health.py:health
    schema: backend/app/api/schemas.py:HealthResponse
    uses:
      - backend/app/config.py:settings
    status: implemented
    semantics: backend HTTP readiness only

  text_chat:
    endpoint: "POST /api/v1/chat"
    route: backend/app/api/routes/chat.py:create_chat_response
    request: backend/app/api/schemas.py:ChatRequest
    response_media_type: text/event-stream
    application_service: backend/app/services/chat.py:ChatService
    runtime_call: ModelRuntime.generate_text_stream
    status: persisted_chat_implemented
    request_contract:
      new_chat: '{"message": "<prompt>"}'
      existing_chat: '{"chat_id": <id>, "message": "<prompt>"}'
    stream_protocol:
      chat:
        data: '{"id": "<chat-id>"}'
      chunk:
        data: '{"text": "<chunk>"}'
      done:
        data: "{}"
      error:
        data: "{}"
    semantics:
      - unknown supplied chat id returns HTTP 404 before StreamingResponse begins
      - first SSE event identifies the persistent chat id
      - user message is persisted before model generation
      - runtime receives at most the most recent 100 persisted conversation messages
      - successful generation persists the complete assistant message
      - partial assistant output is not persisted on failure or cancellation
      - successful stream emits chat, zero or more chunk events, then done
      - done is emitted before optional automatic-title finalization
      - HTTP stream EOF occurs after post-response finalization completes
      - runtime failure emits error and no done event
      - runtime error details are not exposed in the public stream
      - cancellation propagates through service and runtime without becoming an error event

  native_audio:
      flows:
        push_to_talk:
          - chat-window pointer-held recording interaction
          - POST /api/v1/audio/recording/start
          - backend-local microphone capture through PipeWireRecorder
          - POST /api/v1/audio/recording/stop with prior conversation context and optional persistent chat id
          - AudioChatService stops capture and reuses the same WAV for assistant generation and transcription
          - assistant generation receives prior conversation context plus native audio
          - transcription receives native audio only, without conversation context
          - assistant response and transcript stream independently through Avalo SSE
        dialog:
          - chat-window Call action activates continuous dialog mode
          - POST /api/v1/audio/dialog/turn with prior conversation context
          - backend waits indefinitely for speech without creating empty turns
          - simple PCM amplitude detection starts the turn on speech
          - 3 seconds of consecutive silence or 30 seconds from speech start completes the turn
          - after completed capture, a processing SSE event marks the transition from listening to backend processing
          - AudioChatService reuses the captured WAV for assistant generation and transcription
          - assistant generation receives prior conversation context plus native audio
          - transcription receives native audio only, without conversation context
          - assistant response and transcript stream independently through Avalo SSE
          - completed assistant text is read aloud unless TTS was explicitly skipped or stopped
          - after response completion the next dialog listener starts automatically
          - dialog remains active until explicitly ended
      capture_location: python_backend
      capture_adapter: backend/app/audio/capture.py:PipeWireRecorder
      application_service: backend/app/services/audio_chat.py:AudioChatService
      status: push_to_talk_and_dialog_implemented
      notes:
        - browser/WebView microphone capture via MediaRecorder was rejected after WebKitGTK produced zero-byte chunks
        - backend microphone capture uses PipeWire pw-record
        - push-to-talk and dialog capture share one recorder and cannot run concurrently
        - push-to-talk reaching the 30-second duration limit aborts and discards the incomplete fragment
        - dialog reaching the 30-second duration limit completes and submits the current turn
        - dialog silence before first speech is ignored indefinitely
        - dialog silence detection uses a simple configurable RMS threshold without a VAD dependency
        - ending dialog while listening or recording discards the current partial turn
        - dialog has no audio barge-in while the model or TTS response is active
        - stopping dialog response audio does not abort model generation
        - stopping before TTS starts skips TTS for that response while model text continues
        - visible audio user turns initially use the UI placeholder "🎤 Sprachnachricht"
        - Gemma transcribes every submitted push-to-talk and dialog turn from the same captured WAV used for assistant generation
        - transcription requests contain audio only and do not receive prior conversation context
        - transcript and assistant generation run concurrently and fail independently
        - successful transcript chunks progressively replace the placeholder in the frontend
        - completed transcripts are persisted independently of assistant completion and become normal semantic conversation context
        - transcription failure keeps the placeholder and never persists partial transcript output
        - assistant failure does not cancel a still-running transcription
        - abort cancels both consumers, discards partial outputs, and restores the visible audio placeholder
        - temporary captured WAV cleanup occurs after both consumers complete or are cancelled
        - audio route failures are logged with technical exception details and traceback to backend stderr
      constraints:
        max_duration_seconds: 30
        dialog_silence_seconds: 3
        dialog_speech_threshold: 0.015
        target_sample_rate_hz: 16000
        target_channels: 1
        initial_language: de
        separate_stt: false

  tts:
    contract: backend/app/tts/base.py:TextToSpeech
    factory: backend/app/tts/factory.py:create_tts_engine
    service: backend/app/services/tts.py:TtsService
    engines:
      kokoro:
        adapter: backend/app/tts/kokoro.py:KokoroTextToSpeech
        status: default
        model: Kikiri German Victoria / Kokoro-82M
        sample_rate_hz: 24000
      chatterbox:
        adapter: backend/app/tts/chatterbox.py:ChatterboxTextToSpeech
        status: available
        model: Chatterbox Multilingual V2
        quantization: bitsandbytes_4bit
    endpoints:
      synthesize: "POST /api/v1/tts"
      playback_ended: "POST /api/v1/tts/playback-ended"
    status: read_aloud_implemented
    behavior:
      - configured engine is selected once during backend composition
      - unsupported configured engine fails backend startup
      - engine runtime is loaded lazily on first synthesis
      - one synthesis at a time; no queue
      - frontend playback identity controls idle lifecycle
      - engine unload after 300 seconds without synthesis or active playback
      - stale playback-ended notifications are ignored
      - completed Markdown is converted to plain text in the frontend
      - backend returns one complete WAV response
      - Kokoro uses local Victoria model, voice, and config artifacts
      - Chatterbox partitions long text primarily at sentence boundaries
    resource_strategy:
      - Gemma remains fully GPU resident
      - Kokoro is the default because its smaller runtime provides substantially smoother local interaction
      - Chatterbox remains available when its preferred voice quality justifies higher resource cost
    notes:
      - Kokoro device auto-selection prefers CUDA and falls back to CPU.
      - Kokoro model artifacts are local data and are not downloaded by the runtime.
      - Chatterbox V3 won the original quality comparison; the available Chatterbox implementation remains quantized V2.
      - TtsService is engine-independent and owns the shared synthesis/playback/unload lifecycle.

modules:

  backend/app/config.py:
    role: central technical backend configuration
    symbols:
      Settings:
        kind: dataclass
        frozen: true
        fields:
          app_name: str
          api_host: str
          api_port: int
          frontend_dev_origin: str
          default_language: str
          audio_max_seconds: int
          ollama_host: str
          ollama_model: str
          tts_engine: str
          tts_device: str
          tts_chatterbox_model_revision: str
          tts_idle_unload_seconds: float
      settings:
        kind: singleton
        type: Settings
    relevant_to:
      - backend startup
      - health endpoint
      - Ollama runtime
      - audio constraints
      - technical TTS engine selection

  backend/app/main.py:
    role: FastAPI application entry point
    symbols:
      create_app:
        signature: "() -> FastAPI"
      StderrExceptionMiddleware:
        role: write complete uncaught request tracebacks to server stderr and re-raise
      app:
        kind: FastAPI instance
    dependencies:
      - backend/app/api/router.py
      - backend/app/config.py
      - backend/app/user_config.py
      - database migration runner
    behavior:
      - initialize and validate per-user configuration before migrations
      - run Alembic migrations during lifespan startup
      - fail backend startup when configuration or database initialization fails
      - preserve raw technical exception diagnostics on stderr
    relevant_to:
      - backend startup
      - database schema startup
      - middleware
      - error diagnostics
      - CORS
      - top-level routing

  backend/app/api/router.py:
    role: top-level HTTP router composition
    symbols:
      api_router:
        kind: APIRouter
    routes:
      - health router at root
      - UI config router under /api/v1
      - configured avatar asset router under /api/v1
      - chat router under /api/v1
      - audio recording router under /api/v1
      - TTS router under /api/v1
    dependencies:
      - backend/app/api/routes/health.py
      - backend/app/api/routes/ui.py
      - backend/app/api/routes/assets.py
      - backend/app/api/routes/chat.py
      - backend/app/api/routes/audio.py
      - backend/app/api/routes/tts.py

  backend/app/api/schemas.py:
    role: public backend HTTP contracts
    symbols:
      HealthResponse:
        fields:
          status: literal_ok
          service: str
      ConversationMessage:
        fields:
          role: user_or_assistant
          content: non_empty_str
      ChatRequest:
        fields:
          chat_id: optional_positive_int
          message: non_empty_str
        semantics:
          - omitted chat_id creates a persistent chat with the first user message
          - supplied chat_id continues an existing persistent chat
      ChatSummaryResponse:
        fields:
          id: int
          title: str
          pinned: bool
          created_at: datetime
      ChatDetailResponse:
        extends: ChatSummaryResponse
        fields:
          messages: list[PersistentMessageResponse]
      RenameChatRequest:
        fields:
          title: non_empty_str_max_200
      SetChatPinnedRequest:
        fields:
          pinned: bool
      AudioResponseRequest:
        fields:
          messages: list[ConversationMessage]
          chat_id: optional_positive_int
        semantics:
          - omitted chat_id creates a persistent audio chat when the turn is submitted
          - supplied chat_id continues an existing persistent chat
      TtsRequest:
        fields:
          text: non_empty_str
      TtsPlaybackEndedRequest:
        fields:
          playback_id: non_empty_str
      UiConfigResponse:
        fields:
          name: str
          avatar: UiAvatarResponse
        semantics:
          - exposes only frontend-approved runtime configuration
          - exposes effective standard avatar only
          - avatar image locations are backend URLs rather than filesystem paths
      UiAvatarResponse:
        fields:
          standard: UiStandardImageResponse
          animations: list[UiAnimationResponse]
      UiAnimationResponse:
        fields:
          key: str
          category: str
          spriteSetUrl: str
          sprites: list[UiSpriteRegionResponse]
    relevant_to:
      - health API
      - text chat API
      - audio response API
      - TTS synthesis and playback lifecycle API
      - frontend UI configuration contract
      - frontend/backend conversation contract

  backend/app/api/routes/health.py:
    role: backend readiness endpoint
    symbols:
      health:
        signature: "() -> HealthResponse"
    endpoint: "GET /health"
    dependencies:
      - backend/app/api/schemas.py:HealthResponse
      - backend/app/config.py:settings
    status: implemented

  backend/app/api/routes/chat.py:
    role: persisted text-chat HTTP and CRUD boundary
    symbols:
      get_chat_service:
        role: request-scoped ChatService composition using OllamaRuntime and persistence
      format_sse_event:
        role: Avalo SSE event serialization
      create_chat_response:
        signature: "(request: ChatRequest, service: ChatService) -> StreamingResponse"
    endpoints:
      stream: "POST /api/v1/chat"
      list: "GET /api/v1/chats"
      detail: "GET /api/v1/chats/{id}"
      rename: "PATCH /api/v1/chats/{id}"
      pin: "PATCH /api/v1/chats/{id}/pinned"
      delete: "DELETE /api/v1/chats/{id}"
    response_media_type: text/event-stream
    dependencies:
      - backend/app/api/schemas.py
      - backend/app/services/chat.py:ChatService
      - backend/app/runtime/ollama.py:OllamaRuntime
      - backend/app/user_config.py
      - chat persistence repository
    status: implemented
    stream_events:
      - chat
      - chunk
      - done
      - error
    semantics:
      - validates existing chat before StreamingResponse is created
      - emits persistent chat id before assistant chunks
      - emits done before optional post-response title generation
      - performs post-response finalization before stream connection closes
    cancellation:
      - asyncio cancellation is not converted to an error event
      - cancellation propagates into ChatService and ModelRuntime

  backend/app/services/chat.py:
    role: persisted text-chat use-case boundary
    symbols:
      ChatService:
        methods:
          start_turn:
            role: validate or create chat, persist user message, and prepare bounded runtime context
          stream_response:
            role: stream runtime response and persist only the complete successful assistant message
          finalize_turn:
            role: perform optional post-response work such as one-shot automatic title generation
    dependencies:
      - backend/app/runtime/base.py:ModelRuntime
      - backend/app/user_config.py:AvatarConfig
      - chat persistence repository
    status: implemented
    behavior:
      - create a persistent chat atomically with its first user message
      - continue existing persistent chats by id
      - pass only the most recent 100 persisted messages to ModelRuntime
      - prepend the injected avatar persona and instructions as one system message for assistant generation
      - keep automatic title generation independent of avatar persona and instructions
      - accumulate streamed assistant chunks and persist them only on successful completion
      - attempt automatic title generation only after exactly two complete user/assistant roundtrips
      - persist the automatic-title-attempt marker before model title generation
      - never retry a failed automatic title attempt
      - never overwrite a manually assigned title
      - remain independent of concrete runtime adapter
    future_scope:
      - long-term memory is not implemented yet

  backend/app/services/audio_chat.py:
    role: native-audio chat use-case boundary
    symbols:
      AudioChatService:
        role: coordinate push-to-talk and dialog capture with model response generation
    dependencies:
      - backend/app/audio/capture.py:PipeWireRecorder
      - backend/app/runtime/base.py:ModelRuntime
      - backend/app/user_config.py:AvatarConfig
    behavior:
      - start and abort backend-local push-to-talk recording
      - stop push-to-talk capture and reuse one WAV for assistant generation and transcription
      - capture one automatic dialog speech turn and reuse one WAV for both model consumers
      - emit a processing event immediately after dialog capture completes and before model consumers start
      - stream assistant and transcript output independently for both audio interaction modes
      - lazily resolve the active avatar for assistant generation through the injected avatar provider
      - prepend avatar persona and instructions as one system message for audio assistant generation
      - keep transcription independent of avatar persona and instructions
      - persist the audio user placeholder before model processing when persistence is configured
      - replace the persisted placeholder only after successful complete transcription
      - persist a successful complete assistant response independently of transcription completion
      - never persist partial failed transcript or assistant output
      - allow either model consumer to finish successfully when the other fails
      - clean temporary captured audio only after both consumers complete or are cancelled
    status: implemented

  backend/app/runtime/base.py:
    role: model runtime abstraction
    symbols:
      ModelRuntime:
        kind: Protocol
        methods:
          health:
            signature: "() -> bool"
            async: true
          generate_text:
            signature: "(message: str) -> str"
            async: true
          generate_text_stream:
            signature: "(messages: list[dict[str, str]]) -> AsyncIterator[str]"
          generate_from_audio:
            signature: "(audio_file: Path) -> str"
            async: true
          generate_from_audio_stream:
            signature: "(audio_file: Path, messages: list[dict[str, str]]) -> AsyncIterator[str]"
          transcribe_audio_stream:
            signature: "(audio_file: Path) -> AsyncIterator[str]"
    consumers:
      - backend/app/services/chat.py
      - concrete runtime adapters

  backend/app/runtime/ollama.py:
    role: working Ollama runtime adapter used for runtime spike
    symbols:
      OllamaRuntime:
        implements: ModelRuntime
        methods:
          health:
            async: true
            endpoint: "POST /api/show"
            result:
              success: true
              request_or_http_error: false
          generate_text:
            async: true
            endpoint: "POST /api/generate"
            request_streaming: false
            response_contract: "response"
            timeout_seconds: 120
          generate_text_stream:
            kind: async_generator
            endpoint: "POST /v1/chat/completions"
            request_streaming: true
            request_context: full_message_list
            remote_format: OpenAI_compatible_SSE
            yielded_value: non-empty choices[0].delta.content strings
            timeout_seconds: 120
          generate_from_audio:
            async: true
            endpoint: "POST /v1/chat/completions"
            response_contract: "choices[0].message.content"
            audio_encoding: base64_wav
            timeout_seconds: 120
          generate_from_audio_stream:
            kind: async_generator
            endpoint: "POST /v1/chat/completions"
            request_streaming: true
            request_context: prior_messages_plus_current_audio
            remote_format: OpenAI_compatible_SSE
            audio_encoding: base64_wav
            timeout_seconds: 120
          transcribe_audio_stream:
            kind: async_generator
            endpoint: "POST /v1/chat/completions"
            request_streaming: true
            request_context: current_audio_only
            remote_format: OpenAI_compatible_SSE
            audio_encoding: base64_wav
            output_contract: transcription_text_only
            timeout_seconds: 120
    dependencies:
      - backend/app/config.py:settings
      - backend/app/runtime/base.py:ModelRuntime
      - httpx
    status: implemented_spike
    error_semantics:
      remote_errors: RuntimeError
      invalid_remote_response: RuntimeError
      local_audio_file_errors: propagate
      cancellation: propagate
    notes:
      - Complete non-streaming text generation still uses Ollama native /api/generate.
      - Streaming text and native-audio chat both use Ollama OpenAI-compatible /v1/chat/completions.
      - Streaming text receives the full transient message context.
      - Audio assistant generation appends the current native audio input to prior text-compatible context.
      - Audio transcription sends the same native audio in a separate request without conversation context.
      - Streaming cancellation exits the HTTP response and client contexts.
      - Current adapter has passing real Ollama integration coverage for normal streaming.
      - Abort/cancellation is covered deterministically without real Ollama integration.
      - Ollama is a spike implementation; architecture still targets interchangeable runtime.

  backend/app/runtime/llama_cpp.py:
    role: planned llama.cpp runtime adapter
    symbols:
      LlamaCppRuntime:
        methods:
          health: async
          generate_text: async
          generate_from_audio: async
    status: stub
    notes:
      - Preferred target runtime according to current runtime ADR.
      - Runtime spike must establish Gemma 4 native audio feasibility before final adoption.

  backend/app/audio/capture.py:
    role: backend-local microphone capture adapter
    symbols:
      CaptureError:
        kind: RuntimeError
      CapturedAudio:
        kind: frozen_dataclass
        fields:
          path: Path
          duration_seconds: float
          sample_rate_hz: int
          channels: int
      _DialogTurnBuffer:
        role: detect one speech turn from signed 16-bit mono PCM using RMS amplitude
      PipeWireRecorder:
        role: mutually exclusive push-to-talk and automatic dialog capture through pw-record
        methods:
          start:
            role: start push-to-talk WAV capture
            async: true
          stop:
            signature: "() -> CapturedAudio"
            role: finish push-to-talk capture
            async: true
          capture_dialog_turn:
            signature: "() -> CapturedAudio"
            role: wait for speech and finish on silence or duration limit
            async: true
          abort:
            role: stop and discard whichever capture mode is active
            async: true
      inspect_wav:
        signature: "(path: Path) -> CapturedAudio"
    dependencies:
      - PipeWire pw-record
      - backend/app/config.py:settings.audio_max_seconds
    behavior:
      - only one recording may be active per recorder
      - recorder tracks whether the active process belongs to push-to-talk or dialog mode
      - push-to-talk captures directly to WAV
      - dialog captures 16 kHz mono signed-16 PCM from pw-record stdout
      - dialog ignores pre-speech silence and starts buffering at the first chunk above the RMS speech threshold
      - dialog completes after 3 seconds of consecutive post-speech silence and removes trailing silence
      - dialog completes and truncates exactly at the configured 30-second speech-turn limit
      - push-to-talk duration timeout still aborts and discards the recording
      - abort terminates capture and removes temporary output
      - unexpected early pw-record exit reports return code and process stderr
      - hung process shutdown escalates from SIGINT to kill after 2 seconds
    status: implemented

  backend/app/audio/input.py:
    role: native audio normalization and validation boundary
    symbols:
      PreparedAudio:
        kind: dataclass
        frozen: true
        fields:
          path: Path
          duration_seconds: float
          sample_rate_hz:
            type: int
            default: 16000
          channels:
            type: int
            default: 1
      AudioInputPreparer:
        kind: Protocol
        methods:
          prepare:
            signature: "(source: Path) -> PreparedAudio"
            async: true
    status: contract_only
    expected_constraints:
      - maximum 30 seconds
      - 16 kHz
      - mono

  backend/app/services/tts.py:
    role: process-local TTS synthesis and playback lifecycle service
    symbols:
      TtsBusyError:
        kind: RuntimeError
      TtsResult:
        kind: frozen_dataclass
        fields:
          playback_id: str
          audio: bytes
      TtsService:
        responsibilities:
          - reject concurrent synthesis instead of queueing
          - keep cancelled requests busy until underlying synthesis finishes
          - track current frontend playback by generated playback id
