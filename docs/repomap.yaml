architectural_constraints:

  runtime_abstraction:
    rule: application logic depends on ModelRuntime, not concrete runtime adapters
    source:
      - docs/adrs/04-local-llm-runtime.md

  backend_boundary:
    rule: model, audio, and TTS implementation remain in Python backend
    source:
      - docs/adrs/03-backend-fastapi.md

  local_http:
    rule: backend binds to fixed loopback address 127.0.0.1:8095
    source:
      - docs/adrs/05-loopback-http-communication.md

  native_audio:
    rule: initial audio pipeline uses direct Gemma audio input without separate STT
    source:
      - docs/adrs/06-native-gemma-audio.md

  audio_limit:
    rule: push-to-talk recording maximum is 30 seconds
    source:
      - docs/adrs/06-native-gemma-audio.md

  tts_abstraction:
    rule: TTS remains behind interchangeable Python adapter
    source:
      - docs/adrs/07-tts-output.md

  repomap:
    rule: >
      RepoMap is a compact Frieda working index, not authoritative documentation.
      Actual source files must be inspected before implementation.
    source:
      - docs/adrs/08-incremental-repo-map-as-ai-working-index.md

  patching:
    rule: >
      Small localized source changes may be applied through Prompt2Code's
      deterministic custom text format after exact source inspection and must
      be reviewed from final diff and test results.
    source:
      - docs/adrs/09-prompt2code-source-patching.md

