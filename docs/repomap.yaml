schema_version: 1

project:
  name: avalo
  purpose: local desktop companion with text chat, native Gemma audio input, and local TTS
  repomap_role: >
    Persistent working index for Frieda. Used for impact analysis,
    implementation planning, dependency navigation, and selecting source files
    that must be inspected before generating changes.
  authority: source_code
  update_policy: >
    Update only from final accepted implementation state. Re-analyze repository
    when structural changes or accumulated drift make incremental maintenance unreliable.

architecture:
  desktop:
    target: Tauri
    status: implemented_foundation
    responsibility:
      - transparent avatar desktop shell
      - normal chat desktop window
      - backend process lifecycle
      - native desktop input shaping
    windows:
      main:
        role: avatar companion window
        always_on_top: true
        decorations: false
        transparent: true
        close_behavior: exit_application
      chat:
        role: main chat window
        initially_visible: false
        decorations: true
        resizable: true
        close_behavior: hide
    notes:
      - Vue runs in Tauri webviews.
      - Python backend remains a separate local process.
      - Tauri starts, monitors, and stops the backend process it owns.
      - Backend readiness and startup diagnostics are exposed to the frontend.
      - Double-clicking the avatar shows and focuses the existing chat window.
      - Closing the avatar window exits the application and stops the owned backend process.
      - Closing the chat window hides it instead of destroying its webview state.
      - Explicit chat-window geometry persistence is not implemented.
      - Current desktop input shaping is implemented for X11 using native SHAPE input regions.
      - Avatar input regions are generated from the rendered PNG alpha channel.

  frontend:
    technology:
      - Vue 3
      - TypeScript
      - Vite
    root: frontend
    status: implemented_foundation
    communicates_with: backend_http_api
    window_roots:
      main: frontend/src/App.vue
      chat: frontend/src/ChatWindow.vue

  backend:
    technology:
      - Python
      - FastAPI
    root: backend/app
    status: partial
    layers:
      api: HTTP endpoints and public schemas
      application: use-case orchestration
      persistence: SQLite conversation storage and schema lifecycle
      runtime: interchangeable local model adapters
      audio: backend-local audio capture and preparation boundary
      tts: interchangeable speech synthesis adapters
      config: central technical configuration

  communication:
    backend_address: "127.0.0.1:8095"
    transport: HTTP
    request_format: JSON
    streaming_response: SSE_with_JSON_data
    authentication: none
    scope: loopback_only

  conversation:
    persistence: sqlite
    database_path: "~/.avalo/avalo.sqlite"
    schema_management: alembic
    response_mode: streaming
    current_scope:
      - text chats and completed text messages are persisted
      - application startup always begins with a fresh transient New Chat
      - a transient New Chat is persisted only when its first message is sent
      - persisted chats can be listed and reopened with complete stored history
      - model context for text chat is limited to the most recent 100 persisted messages
      - assistant text is persisted only after successful complete generation
      - aborted or failed partial assistant output is not persisted
      - chat titles start as timestamp-based New titles
      - one automatic title attempt occurs after exactly two complete text roundtrips
      - manual chat titles suppress automatic title generation permanently
      - chats have a persisted pinned flag
      - pinned and unpinned chats remain in backend activity order; frontend separates them for sidebar presentation
      - persisted chats can be manually renamed, pinned/unpinned, physically deleted, and exported as Markdown
      - Markdown export reloads the persisted chat detail before writing so exported content reflects stored chronological messages
      - exported message content is preserved as stored, with H1 role headings and separators only between messages
      - deleting the currently visible persisted chat returns the frontend to an empty transient New Chat state
      - text and audio UI continue to share the visible frontend conversation
      - audio user turns remain represented by the transient "🎤 Sprachnachricht" placeholder
      - prior audio UI placeholders are excluded from semantic model context
      - audio content itself is not persisted yet
      - multiple persisted chats may have independent concurrent text streams
      - active text turns survive visible chat switching in frontend memory
      - Stop affects only the currently selected running chat

key_flows:

  backend_startup:
    entry: backend/app/main.py:create_app
    uses:
      - backend/app/config.py:settings
      - backend/app/api/router.py:api_router
      - Alembic migration runner
    behavior:
      - creates FastAPI application
      - runs database migrations to current Alembic head during application lifespan startup
      - backend startup fails when database initialization or migration fails
      - database startup failures write their full traceback to server stderr
      - uncaught request exceptions write their full traceback to server stderr
      - configures frontend CORS origin
      - allows browser frontend GET, POST, PATCH, and DELETE requests
      - installs API router

  health:
    endpoint: "GET /health"
    route: backend/app/api/routes/health.py:health
    schema: backend/app/api/schemas.py:HealthResponse
    uses:
      - backend/app/config.py:settings
    status: implemented
    semantics: backend HTTP readiness only

  text_chat:
    endpoint: "POST /api/v1/chat"
    route: backend/app/api/routes/chat.py:create_chat_response
    request: backend/app/api/schemas.py:ChatRequest
    response_media_type: text/event-stream
    application_service: backend/app/services/chat.py:ChatService
    runtime_call: ModelRuntime.generate_text_stream
    status: persisted_chat_implemented
    request_contract:
      new_chat: '{"message": "<prompt>"}'
      existing_chat: '{"chat_id": <id>, "message": "<prompt>"}'
    stream_protocol:
      chat:
        data: '{"id": "<chat-id>"}'
      chunk:
        data: '{"text": "<chunk>"}'
      done:
        data: "{}"
      error:
        data: "{}"
    semantics:
      - unknown supplied chat id returns HTTP 404 before StreamingResponse begins
      - first SSE event identifies the persistent chat id
      - user message is persisted before model generation
      - runtime receives at most the most recent 100 persisted conversation messages
      - successful generation persists the complete assistant message
      - partial assistant output is not persisted on failure or cancellation
      - successful stream emits chat, zero or more chunk events, then done
      - done is emitted before optional automatic-title finalization
      - HTTP stream EOF occurs after post-response finalization completes
      - runtime failure emits error and no done event
      - runtime error details are not exposed in the public stream
      - cancellation propagates through service and runtime without becoming an error event

  native_audio:
      flow:
        - chat-window push-to-talk interaction
        - POST /api/v1/audio/recording/start
        - backend-local microphone capture through PipeWireRecorder
        - POST /api/v1/audio/recording/stop with prior conversation context
        - AudioChatService stops capture and passes WAV plus context to ModelRuntime
        - OllamaRuntime sends prior context plus native audio to /v1/chat/completions
        - model response streams back through Avalo SSE
      capture_location: python_backend
      capture_adapter: backend/app/audio/capture.py:PipeWireRecorder
      application_service: backend/app/services/audio_chat.py:AudioChatService
      status: end_to_end_spike_implemented
      notes:
        - browser/WebView microphone capture via MediaRecorder was rejected after WebKitGTK produced zero-byte chunks
        - backend microphone capture uses PipeWire pw-record
        - frontend push-to-talk controls backend recording lifecycle
        - quick pointer release while backend start is pending is completed after start succeeds
        - pointer cancellation aborts and discards capture
        - reaching the duration limit aborts capture and discards the incomplete audio fragment
        - visible audio user turns use the UI placeholder "🎤 Sprachnachricht"
        - previous audio placeholders are not sent back as semantic model context
        - no transcript is currently retained for previous audio user turns
      constraints:
        max_duration_seconds: 30
        target_sample_rate_hz: 16000
        target_channels: 1
        initial_language: de
        separate_stt: false

  tts:
    contract: backend/app/tts/base.py:TextToSpeech
    adapter: backend/app/tts/chatterbox.py:ChatterboxTextToSpeech
    service: backend/app/services/tts.py:TtsService
    endpoints:
      synthesize: "POST /api/v1/tts"
      playback_ended: "POST /api/v1/tts/playback-ended"
    status: read_aloud_implemented
    engine: Chatterbox Multilingual V2
    quantization: bitsandbytes_4bit
    behavior:
      - lazy model load on first synthesis
      - one synthesis at a time; no queue
      - frontend playback identity controls idle lifecycle
      - model unload after 300 seconds without synthesis or active playback
      - stale playback-ended notifications are ignored
      - completed Markdown is converted to plain text in the frontend
      - backend returns one complete WAV response
      - long text is partitioned primarily at sentence boundaries
      - sentences above roughly 300 characters fall back to clause boundaries then whitespace
    resource_strategy:
      - Gemma remains fully GPU resident
      - TTS is quantized to fit alongside the primary LLM
      - full-message generation without partitioning can exceed available 8 GB VRAM
    notes:
      - Chatterbox V3 won the original quality comparison but the integrated quantized fork is V2.
      - Current 4-bit quality loss is accepted for the first integration.
      - Quantization depends on a pinned non-upstream Chatterbox fork.

modules:

  backend/app/config.py:
    role: central backend configuration
    symbols:
      Settings:
        kind: dataclass
        frozen: true
        fields:
          app_name: str
          api_host: str
          api_port: int
          frontend_dev_origin: str
          default_language: str
          audio_max_seconds: int
          ollama_host: str
          ollama_model: str
          tts_device: str
          tts_reference_audio: str
          tts_model_revision: str
          tts_idle_unload_seconds: float
      settings:
        kind: singleton
        type: Settings
    relevant_to:
      - backend startup
      - health endpoint
      - Ollama runtime
      - audio constraints

  backend/app/main.py:
    role: FastAPI application entry point
    symbols:
      create_app:
        signature: "() -> FastAPI"
      StderrExceptionMiddleware:
        role: write complete uncaught request tracebacks to server stderr and re-raise
      app:
        kind: FastAPI instance
    dependencies:
      - backend/app/api/router.py
      - backend/app/config.py
      - database migration runner
    behavior:
      - run Alembic migrations during lifespan startup
      - fail backend startup when database initialization fails
      - preserve raw technical exception diagnostics on stderr
    relevant_to:
      - backend startup
      - database schema startup
      - middleware
      - error diagnostics
      - CORS
      - top-level routing

  backend/app/api/router.py:
    role: top-level HTTP router composition
    symbols:
      api_router:
        kind: APIRouter
    routes:
      - health router at root
      - chat router under /api/v1
      - audio recording router under /api/v1
      - TTS router under /api/v1
    dependencies:
      - backend/app/api/routes/health.py
      - backend/app/api/routes/chat.py
      - backend/app/api/routes/audio.py
      - backend/app/api/routes/tts.py

  backend/app/api/schemas.py:
    role: public backend HTTP contracts
    symbols:
      HealthResponse:
        fields:
          status: literal_ok
          service: str
      ConversationMessage:
        fields:
          role: user_or_assistant
          content: non_empty_str
      ChatRequest:
        fields:
          chat_id: optional_positive_int
          message: non_empty_str
        semantics:
          - omitted chat_id creates a persistent chat with the first user message
          - supplied chat_id continues an existing persistent chat
      ChatSummaryResponse:
        fields:
          id: int
          title: str
          pinned: bool
          created_at: datetime
      ChatDetailResponse:
        extends: ChatSummaryResponse
        fields:
          messages: list[PersistentMessageResponse]
      RenameChatRequest:
        fields:
          title: non_empty_str_max_200
      SetChatPinnedRequest:
        fields:
          pinned: bool
      AudioResponseRequest:
        fields:
          messages: list[ConversationMessage]
      TtsRequest:
        fields:
          text: non_empty_str
      TtsPlaybackEndedRequest:
        fields:
          playback_id: non_empty_str
    relevant_to:
      - health API
      - text chat API
      - audio response API
      - TTS synthesis and playback lifecycle API
      - frontend/backend conversation contract

  backend/app/api/routes/health.py:
    role: backend readiness endpoint
    symbols:
      health:
        signature: "() -> HealthResponse"
    endpoint: "GET /health"
    dependencies:
      - backend/app/api/schemas.py:HealthResponse
      - backend/app/config.py:settings
    status: implemented

  backend/app/api/routes/chat.py:
    role: persisted text-chat HTTP and CRUD boundary
    symbols:
      get_chat_service:
        role: request-scoped ChatService composition using OllamaRuntime and persistence
      format_sse_event:
        role: Avalo SSE event serialization
      create_chat_response:
        signature: "(request: ChatRequest, service: ChatService) -> StreamingResponse"
    endpoints:
      stream: "POST /api/v1/chat"
      list: "GET /api/v1/chats"
      detail: "GET /api/v1/chats/{id}"
      rename: "PATCH /api/v1/chats/{id}"
      pin: "PATCH /api/v1/chats/{id}/pinned"
      delete: "DELETE /api/v1/chats/{id}"
    response_media_type: text/event-stream
    dependencies:
      - backend/app/api/schemas.py
      - backend/app/services/chat.py:ChatService
      - backend/app/runtime/ollama.py:OllamaRuntime
      - chat persistence repository
    status: implemented
    stream_events:
      - chat
      - chunk
      - done
      - error
    semantics:
      - validates existing chat before StreamingResponse is created
      - emits persistent chat id before assistant chunks
      - emits done before optional post-response title generation
      - performs post-response finalization before stream connection closes
    cancellation:
      - asyncio cancellation is not converted to an error event
      - cancellation propagates into ChatService and ModelRuntime

  backend/app/services/chat.py:
    role: persisted text-chat use-case boundary
    symbols:
      ChatService:
        methods:
          start_turn:
            role: validate or create chat, persist user message, and prepare bounded runtime context
          stream_response:
            role: stream runtime response and persist only the complete successful assistant message
          finalize_turn:
            role: perform optional post-response work such as one-shot automatic title generation
    dependencies:
      - backend/app/runtime/base.py:ModelRuntime
      - chat persistence repository
    status: implemented
    behavior:
      - create a persistent chat atomically with its first user message
      - continue existing persistent chats by id
      - pass only the most recent 100 messages to ModelRuntime
      - accumulate streamed assistant chunks and persist them only on successful completion
      - attempt automatic title generation only after exactly two complete user/assistant roundtrips
      - persist the automatic-title-attempt marker before model title generation
      - never retry a failed automatic title attempt
      - never overwrite a manually assigned title
      - remain independent of concrete runtime adapter
    future_scope:
      - persona and long-term memory are not implemented yet

  backend/app/services/audio_chat.py:
    role: native-audio chat use-case boundary
    symbols:
      AudioChatService:
        role: coordinate microphone capture lifecycle and model response generation
    dependencies:
      - backend/app/audio/capture.py:PipeWireRecorder
      - backend/app/runtime/base.py:ModelRuntime
    behavior:
      - start and abort backend-local recording
      - stop capture and pass WAV plus prior conversation context to runtime
      - stream assistant response
      - clean temporary captured audio after generation
    status: implemented_spike

  backend/app/runtime/base.py:
    role: model runtime abstraction
    symbols:
      ModelRuntime:
        kind: Protocol
        methods:
          health:
            signature: "() -> bool"
            async: true
          generate_text:
            signature: "(message: str) -> str"
            async: true
          generate_text_stream:
            signature: "(messages: list[dict[str, str]]) -> AsyncIterator[str]"
          generate_from_audio:
            signature: "(audio_file: Path) -> str"
            async: true
          generate_from_audio_stream:
            signature: "(audio_file: Path, messages: list[dict[str, str]]) -> AsyncIterator[str]"
    consumers:
      - backend/app/services/chat.py
      - concrete runtime adapters

  backend/app/runtime/ollama.py:
    role: working Ollama runtime adapter used for runtime spike
    symbols:
      OllamaRuntime:
        implements: ModelRuntime
        methods:
          health:
            async: true
            endpoint: "POST /api/show"
            result:
              success: true
              request_or_http_error: false
          generate_text:
            async: true
            endpoint: "POST /api/generate"
            request_streaming: false
            response_contract: "response"
            timeout_seconds: 120
          generate_text_stream:
            kind: async_generator
            endpoint: "POST /v1/chat/completions"
            request_streaming: true
            request_context: full_message_list
            remote_format: OpenAI_compatible_SSE
            yielded_value: non-empty choices[0].delta.content strings
            timeout_seconds: 120
          generate_from_audio:
            async: true
            endpoint: "POST /v1/chat/completions"
            response_contract: "choices[0].message.content"
            audio_encoding: base64_wav
            timeout_seconds: 120
          generate_from_audio_stream:
            kind: async_generator
            endpoint: "POST /v1/chat/completions"
            request_streaming: true
            request_context: prior_messages_plus_current_audio
            remote_format: OpenAI_compatible_SSE
            audio_encoding: base64_wav
            timeout_seconds: 120
    dependencies:
      - backend/app/config.py:settings
      - backend/app/runtime/base.py:ModelRuntime
      - httpx
    status: implemented_spike
    error_semantics:
      remote_errors: RuntimeError
      invalid_remote_response: RuntimeError
      local_audio_file_errors: propagate
      cancellation: propagate
    notes:
      - Complete non-streaming text generation still uses Ollama native /api/generate.
      - Streaming text and native-audio chat both use Ollama OpenAI-compatible /v1/chat/completions.
      - Streaming text receives the full transient message context.
      - Audio streaming appends the current native audio input to prior text-compatible context.
      - Streaming cancellation exits the HTTP response and client contexts.
      - Current adapter has passing real Ollama integration coverage for normal streaming.
      - Abort/cancellation is covered deterministically without real Ollama integration.
      - Ollama is a spike implementation; architecture still targets interchangeable runtime.

  backend/app/runtime/llama_cpp.py:
    role: planned llama.cpp runtime adapter
    symbols:
      LlamaCppRuntime:
        methods:
          health: async
          generate_text: async
          generate_from_audio: async
    status: stub
    notes:
      - Preferred target runtime according to current runtime ADR.
      - Runtime spike must establish Gemma 4 native audio feasibility before final adoption.

  backend/app/audio/capture.py:
    role: backend-local microphone capture adapter
    symbols:
      CaptureError:
        kind: RuntimeError
      CapturedAudio:
        kind: frozen_dataclass
        fields:
          path: Path
          duration_seconds: float
          sample_rate_hz: int
          channels: int
      PipeWireRecorder:
        role: single push-to-talk capture lifecycle through pw-record
        methods:
          start:
            async: true
          stop:
            signature: "() -> CapturedAudio"
            async: true
          abort:
            async: true
      inspect_wav:
        signature: "(path: Path) -> CapturedAudio"
    dependencies:
      - PipeWire pw-record
      - backend/app/config.py:settings.audio_max_seconds
    behavior:
      - only one recording may be active per recorder
      - stop terminates pw-record with SIGINT and validates resulting WAV metadata
      - abort terminates capture and removes the temporary WAV
      - duration timeout aborts and discards the incomplete recording
      - invalid or failed captures are removed
      - hung process shutdown escalates from SIGINT to kill after 2 seconds
    status: implemented_spike

  backend/app/audio/input.py:
    role: native audio normalization and validation boundary
    symbols:
      PreparedAudio:
        kind: dataclass
        frozen: true
        fields:
          path: Path
          duration_seconds: float
          sample_rate_hz:
            type: int
            default: 16000
          channels:
            type: int
            default: 1
      AudioInputPreparer:
        kind: Protocol
        methods:
          prepare:
            signature: "(source: Path) -> PreparedAudio"
            async: true
    status: contract_only
    expected_constraints:
      - maximum 30 seconds
      - 16 kHz
      - mono

  backend/app/services/tts.py:
    role: process-local TTS synthesis and playback lifecycle service
    symbols:
      TtsBusyError:
        kind: RuntimeError
      TtsResult:
        kind: frozen_dataclass
        fields:
          playback_id: str
          audio: bytes
      TtsService:
        responsibilities:
          - reject concurrent synthesis instead of queueing
          - keep cancelled requests busy until underlying synthesis finishes
          - track current frontend playback by generated playback id
          - ignore stale playback-ended notifications
          - unload engine after configured idle period
    dependencies:
      - backend/app/tts/base.py:TextToSpeech
    status: implemented

  backend/app/tts/base.py:
    role: runtime-independent TTS abstraction
    symbols:
      TextToSpeech:
        kind: Protocol
        methods:
          synthesize:
            signature: "(text: str) -> bytes"
            async: true
          unload:
            signature: "() -> None"
            async: true
    status: implemented_contract

  backend/app/tts/chatterbox.py:
    role: local Chatterbox TTS adapter
    symbols:
      ChatterboxTextToSpeech:
        methods:
          synthesize:
            signature: "(text: str) -> bytes"
            async: true
          unload:
            signature: "() -> None"
            async: true
    status: implemented
    dependencies:
      - backend/app/config.py
      - Chatterbox Multilingual V2
      - bitsandbytes 4-bit quantization
      - torchaudio
      - huggingface_hub
    behavior:
      - lazily loads pinned Chatterbox model snapshot
      - uses fixed configured reference audio and German language
      - synthesizes sentence-oriented chunks and concatenates them into one WAV
      - moves generated chunks to CPU before final concatenation
      - releases model and CUDA cache on unload

  frontend/src/main.ts:
    role: Vue application bootstrap and Tauri window-root selector
    behavior:
      - initialize active avatar configuration before mounting Vue
      - mounts ChatWindow.vue for Tauri window label chat
      - mounts App.vue otherwise
      - sets avatar-window title from active avatar name
      - sets chat-window title to "Chat Window"
      - preserves browser development without requiring a Tauri runtime
      - logs bootstrap failure and leaves the app unmounted
    dependencies:
      - frontend/src/avatar.ts
    relevant_to:
      - frontend startup
      - avatar configuration
      - desktop window composition
      - App.vue
      - ChatWindow.vue
      - global styles

  frontend/src/App.vue:
    role: avatar companion root UI component
    status: implemented_foundation
    relevant_to:
      - backend startup diagnostics
      - avatar rendering
      - avatar drag interaction
      - avatar scaling and native window resize
      - avatar push-to-talk UI
      - audio recording countdown
      - application exit
      - chat-window opening
      - alpha-based avatar hit detection
      - native input-shape generation
      - frontend tests
    dependencies:
      - frontend/src/avatar.ts
      - frontend/src/services/appLifecycle.ts
      - frontend/src/services/backendLifecycle.ts
      - frontend/src/services/inputShape.ts
      - frontend/src/services/chatWindow.ts
      - frontend/src/services/windowDrag.ts
    interaction:
      - renders active avatar image and name from avatar configuration
      - avatar drag starts only after pointer movement crosses a small threshold
      - avatar double-click opens the chat window
      - double-click remains functional after moving the avatar
      - Ctrl+Plus and Ctrl+Minus scale the avatar in 10 percent steps between 50 and 150 percent
      - avatar scale is session-local and not persisted
      - avatar content size drives native avatar-window resize
      - avatar resize requests are serialized through a single-flight synchronization loop
      - native window resize completion is followed by browser resize before recalculating X11 input shape
      - avoids applying an input shape from stale pre-resize DOM geometry
      - audio button enters recording UI state while pointer is held
      - recording UI resets on pointer release or cancellation
      - recording UI aborts after 30 seconds
      - exit button terminates the Avalo application
      - audio and exit buttons are included in native X11 input regions
      - current frontend audio interaction does not capture microphone data


  frontend/src/ChatWindow.vue:
    role: main chat-window Vue root
    status: implemented_persisted_chat
    current_behavior:
      - starts with a fresh transient New Chat
      - loads persisted chat summaries into the conversation sidebar
      - retries the initial sidebar load up to 20 times with 500 ms delay while backend startup may still be in progress
      - always renders a separate Pinned Chats section before normal chat history
      - filters pinned chats out of normal history without duplicating entries
      - preserves backend activity ordering inside pinned and normal sections
      - renders persisted chat titles with ellipsis and full native tooltip
      - exposes a hover-only per-chat management menu
      - menu provides Pin, Rename, Export, and Delete entries
      - Export opens the native desktop save dialog and writes the complete persisted chat as Markdown
      - export cancellation is silent; load or write failures use the existing chat error area
      - Pin toggles persisted pinned state
      - Rename uses a modal dialog with the current title prefilled and trims input before saving
      - whitespace-only rename is rejected without changing the existing title
      - Delete uses a modal confirmation and physically removes the chat through the backend
      - Escape closes chat menus and management dialogs
      - outside pointer interaction closes an open chat menu
      - shows an activity indicator for persisted chats with running requests
      - loads complete persisted history when an existing chat is selected
      - leaves the current chat unchanged when loading another chat fails
      - discards unsent composer text when switching chats or starting New Chat
      - sends messages through streaming backend client
      - keeps the composer editable while visible generation is active
      - disables sending and audio recording while visible generation is active
      - preserves a newly typed draft when the active generation completes, fails, or is stopped
      - switches Send action to Stop during visible generation
      - New Chat does not abort a text response running in another chat
      - implements multiline-aware Enter / Shift+Enter / Ctrl+Enter semantics
      - normal composer sends Enter only while the Markdown source is single-line
      - expanded composer always reserves Enter for editing and sends only with Ctrl+Enter
      - renders user and assistant messages through MarkdownMessage
      - preserves explicit user line breaks while retaining Markdown rendering
      - renders a centered watermark behind the scrollable conversation area
      - supports icon-based Send, Stop, New Chat, and composer expand/collapse actions
      - expanded composer uses the available chat-main area with the same Milkdown editor instance
      - expanded composer enables the Markdown formatting toolbar
      - preserves composer state across expand/collapse
      - renders role-specific message actions
      - message Copy writes Markdown source as text/plain and rendered content as text/html when supported
      - message Copy falls back to plain Markdown clipboard text
      - Read aloud synthesizes completed assistant messages and plays the returned WAV
      - a new Read aloud replaces current TTS playback
      - Read aloud is disabled while LLM generation or TTS synthesis is active
      - TTS failures are shown as a chat error without modifying the assistant message
      - Branch and Edit actions remain visible disabled placeholders
      - uses Milkdown for user Markdown composition with Markdown source as canonical frontend state
      - supports draggable sidebar splitter with bounded width
      - automatically follows streamed assistant output
      - implements push-to-talk backend recording control
      - shows 30-second recording countdown
      - aborts and discards recording at the duration limit
      - handles pointer release that occurs while backend recording start is still pending
      - renders audio user turns as "🎤 Sprachnachricht"
      - streams audio-triggered assistant responses into the normal conversation
    relevant_to:
      - transient text and audio chat UI
      - conversation sidebar
      - current conversation view
      - Markdown rendering and composition
      - streaming interaction
      - frontend chat tests
    dependencies:
      - frontend/src/avatar.ts
      - frontend/src/composables/useTransientChat.ts
      - frontend/src/components/MarkdownMessage.vue
      - frontend/src/components/MarkdownComposer.vue
      - frontend/src/services/chatExport.ts


  frontend/src/services/chatExport.ts:
    role: persisted-chat Markdown export and native desktop save boundary
    responsibilities:
      - reload persisted chat detail before export
      - serialize stored messages chronologically without transforming message Markdown
      - label user messages as User and assistant messages with the active avatar name
      - separate messages with Markdown horizontal rules without a trailing separator
      - sanitize problematic filename characters and fall back to chat.md when necessary
      - open the native Tauri save dialog with a Markdown filename
      - write the selected file through the Tauri filesystem plugin
      - treat save-dialog cancellation as a successful no-op
      - propagate chat-load and file-write failures to the caller
    dependencies:
      - frontend/src/services/backend.ts
      - "@tauri-apps/plugin-dialog"
      - "@tauri-apps/plugin-fs"
    relevant_to:
      - persisted chat export
      - native save dialog
      - Markdown export format
      - chat management menu


  frontend/src/avatar.ts:
    role: frontend active-avatar configuration loader
    responsibilities:
      - define current source-selected avatar id
      - load registered avatar.yaml and standard.png assets through explicit static Vite imports
      - parse avatar.yaml with YAML parser
      - require non-empty avatar name
      - fail when the requested registered avatar is missing
      - expose initialized active avatar to frontend components
    current_scope:
      - only avatar name is consumed
      - persona and instructions remain unused
      - current active avatar is selected in source code
      - currently available avatars are declared in an explicit source registry
      - adding another avatar requires adding its asset imports and registry entry

    dependencies:
      - yaml
      - frontend/src/assets/avatars/frieda1/avatar.yaml
      - frontend/src/assets/avatars/frieda1/standard.png
    relevant_to:
      - frontend startup
      - avatar identity
      - avatar rendering
      - window title
      - assistant role label

  frontend/src/services/appLifecycle.ts:
    role: frontend Tauri boundary for application lifecycle
    responsibilities:
      - invoke native application-exit command
    consumers:
      - frontend/src/App.vue
    native_counterpart:
      - src-tauri/src/main.rs

  frontend/src/services/chatWindow.ts:
    role: frontend Tauri boundary for chat-window lifecycle
    responsibilities:
      - invoke native command that shows and focuses the chat window
    native_counterpart:
      - src-tauri/src/main.rs

  frontend/src/services/windowDrag.ts:
    role: frontend Tauri boundary for avatar-window dragging
    responsibilities:
      - start native drag of the current avatar window
    consumers:
      - frontend/src/App.vue

  frontend/src/services/backend.ts:
    role: frontend HTTP boundary for backend communication
    responsibilities:
      - health calls
      - list persisted chats through GET /api/v1/chats
      - load persisted chat detail through GET /api/v1/chats/{id}
      - rename persisted chats through PATCH /api/v1/chats/{id}
      - update persisted pinned state through PATCH /api/v1/chats/{id}/pinned
      - delete persisted chats through DELETE /api/v1/chats/{id}
      - expose pinned state on persisted chat summaries and details
      - POST streaming text requests as chat_id plus message to /api/v1/chat
      - accept the persistent chat id from the initial SSE chat event
      - start backend recording through /api/v1/audio/recording/start
      - abort backend recording through /api/v1/audio/recording/abort
      - stop recording and stream native-audio response through /api/v1/audio/recording/stop
      - synthesize plain text through /api/v1/tts and return WAV response plus playback id
      - notify backend playback completion through /api/v1/tts/playback-ended
      - parse Avalo SSE chat / chunk / done / error events
      - expose done separately while continuing to read until HTTP stream EOF
      - expose AbortSignal cancellation to callers
      - reject malformed or incomplete streams
    relevant_to:
      - backend URL/contracts
      - persisted chat CRUD reads
      - streaming text chat
      - native-audio recording and response flow
    inspect_before:
      - changing backend API paths
      - changing frontend/backend transport
      - changing public chat stream protocol

  frontend/src/types/chat.ts:
    role: frontend chat message presentation types
    symbols:
      ChatMessage:
        fields:
          role: user_or_assistant
          content: str
          kind: optional_text_or_audio
    relevant_to:
      - frontend conversation state
      - frontend persisted-history rendering
      - transient audio UI messages
    inspect_with:
      - frontend/src/composables/useTransientChat.ts
      - frontend/src/ChatWindow.vue

  frontend/src/composables/useTransientChat.ts:
    role: persisted-chat-aware client-side chat state machine
    responsibilities:
      - hold the currently visible chat state and transient New Chat state
      - maintain persisted chat summaries for the sidebar
      - update chat summaries after successful rename and pin changes
      - remove deleted chats from frontend summary/state caches only after backend success
      - return to a fresh transient New Chat state when the currently visible chat is deleted
      - keep rename, pin, and delete state unchanged when the backend operation fails and expose a user-facing error
      - load persisted chat history before switching visible state
      - keep independent frontend state for persisted chats with running requests
      - allow text generation in different chats concurrently
      - prevent a second turn in the same chat while its request is still active
      - keep background text streams alive while another chat is visible
      - restore partial assistant output and Stop behavior when returning to a running chat
      - assign a newly created persistent chat id from the SSE chat event
      - refresh persisted chat summaries after request EOF
      - distinguish visible generation completion at SSE done from request completion at EOF
      - keep the active turn internally until EOF so automatic-title finalization cannot race a new same-chat send
      - derive audio model context from current visible UI messages
      - exclude prior audio UI placeholders from semantic model context
      - append assistant chunks incrementally
      - abort only the active turn belonging to the selected chat
      - roll back complete text turn on Stop or technical failure
      - keep visible audio user contribution when audio response fails or is stopped
      - restore original text prompt exactly after rollback
      - ignore stale callbacks from superseded turns
      - log frontend chat-list and chat-load transport failures to console.error
    dependencies:
      - frontend/src/services/backend.ts
      - frontend/src/types/chat.ts

  frontend/src/components/MarkdownComposer.vue:
    role: Vue provider boundary for user Markdown composition
    responsibilities:
      - own the MilkdownProvider required by the editor
      - expose v-model compatible Markdown source
      - forward keyboard events to ChatWindow
      - forward expanded-mode toolbar enablement to the Milkdown editor
    dependencies:
      - "@milkdown/vue"
      - frontend/src/components/MarkdownComposerEditor.vue
    relevant_to:
      - chat composer
      - Markdown editing
      - expanded composer toolbar
      - frontend composer tests

  frontend/src/components/MarkdownComposerEditor.vue:
    role: Milkdown-backed WYSIWYG Markdown editor
    responsibilities:
      - initialize Milkdown from canonical Markdown source
      - emit Markdown updates back through the composer v-model
      - apply external Markdown-source updates without feedback loops
      - use CommonMark and GFM editor presets
      - expose formatting toolbar only when enabled by ChatWindow
      - execute typed Milkdown commands for bold, italic, headings, lists, links, inline code, code blocks, blockquotes, horizontal rules, tables, and list indentation
      - request link URLs through a simple browser prompt
      - style code blocks and tables for visible editor structure
    dependencies:
      - "@milkdown/kit"
      - "@milkdown/vue"
    relevant_to:
      - Markdown composer behavior
      - formatting toolbar
      - canonical Markdown synchronization
      - frontend composer tests

  frontend/src/components/MarkdownMessage.vue:
    role: shared Markdown renderer for user and assistant messages

    responsibilities:
      - render standard Markdown with raw HTML disabled
      - render tables, lists, headings, blockquotes, and links
      - syntax-highlight fenced code with highlight.js
      - add Copy action for fenced code
      - expose current rendered message HTML to ChatWindow for multi-format clipboard copy
      - expose rendered plain text to ChatWindow for Read Aloud
      - route rendered links through externalLinks service
    dependencies:
      - markdown-it
      - highlight.js
      - frontend/src/services/externalLinks.ts
    security:
      raw_html: disabled

  frontend/src/services/externalLinks.ts:
    role: frontend boundary for opening rendered Markdown links externally
    responsibilities:
      - allow only http, https, mailto, and tel protocols
      - use Tauri opener inside desktop runtime
      - use new browser tab during browser development
    native_dependency:
      - tauri-plugin-opener

  frontend/src/services/backendLifecycle.ts:
    role: Tauri frontend boundary for backend lifecycle state
    responsibilities:
      - retrieve buffered backend startup snapshot
      - subscribe to backend status events
      - subscribe to backend log events
    native_counterpart:
      - src-tauri/src/backend.rs

  frontend/src/services/inputShape.ts:
    role: Tauri frontend boundary for avatar geometry and native input regions
    responsibilities:
      - send generated input rectangles to native Tauri command
      - resize the native avatar window to requested logical dimensions
    native_counterpart:
      - src-tauri/src/input_shape.rs
      - src-tauri/src/main.rs


  frontend/src/assets/avatars/frieda1/avatar.yaml:
    role: current avatar identity and future persona configuration
    current_usage:
      - name
    currently_unused:
      - persona
      - instructions
    relevant_to:
      - avatar identity
      - frontend startup

  frontend/src/assets/avatars/frieda1/standard.png:
    role: current default avatar image
    relevant_to:
      - companion rendering
      - alpha-derived X11 input shape

  src-tauri/src/main.rs:
    role: Tauri desktop application entry point
    responsibilities:
      - manage backend process lifecycle
      - expose backend snapshot command
      - expose native input-region command
      - expose avatar-window resize command with finite positive dimension validation
      - expose chat-window show/focus command

      - expose explicit application-exit command
      - exit application when avatar window is closed
      - hide chat window instead of destroying it on close
      - stop owned backend on application exit
    dependencies:
      - src-tauri/src/backend.rs
      - src-tauri/src/input_shape.rs


  src-tauri/tauri.conf.json:
    role: Tauri desktop window configuration
    windows:
      main:
        role: avatar window
        always_on_top: true
        decorations: false
        transparent: true
      chat:
        role: chat window
        initially_visible: false
        decorations: true
        resizable: true
        min_size: "700x500"
        initial_size: "1100x800"

  src-tauri/src/backend.rs:
    role: Tauri-managed Python backend process lifecycle
    responsibilities:
      - start backend through scripts/xstart-backend.sh
      - disable uvicorn reload for Tauri-managed process
      - capture backend stdout and stderr
      - poll backend health readiness
      - buffer lifecycle status and diagnostic logs
      - stop owned backend process
    status: implemented

  src-tauri/src/input_shape.rs:
    role: native X11 input-shape adapter
    platform: X11
    mechanism: X11 SHAPE extension input region
    responsibilities:
      - receive frontend-generated input rectangles
      - resolve native Tauri Xlib or XCB window id
      - apply rectangles as native X11 input shape
    status: implemented_spike
    notes:
      - Input rectangles currently represent the rendered avatar alpha mask.
      - Transparent pixels pass pointer input through to windows below Avalo.
      - Other interactive UI regions must later be unioned into the native input shape.

tests:

  tests/backend/test_config.py:
    covers:
      - backend configuration defaults
    inspect_with:
      - backend/app/config.py

  tests/backend/test_health.py:
    covers:
      - health endpoint behavior
    inspect_with:
      - backend/app/api/routes/health.py
      - backend/app/main.py
      - backend/app/config.py

  tests/backend/test_chat_contract.py:
    covers:
      - persisted public SSE text chat API contract
      - chat id event before streamed assistant chunks
      - chunk ordering and done event
      - chat_id plus message request validation
      - unknown chat rejection before stream creation
      - runtime failure mapped to error event without done
      - cancellation propagation without SSE error conversion
    inspect_with:
      - backend/app/api/routes/chat.py
      - backend/app/api/schemas.py
      - backend/app/services/chat.py
      - chat persistence implementation

  tests/backend/test_chat_service.py:
    covers:
      - persistent ChatService turn orchestration
      - runtime context selection
      - runtime chunk ordering
      - complete assistant persistence
      - incomplete assistant rollback semantics
      - automatic title eligibility and one-shot behavior
    inspect_with:
      - backend/app/services/chat.py
      - backend/app/runtime/base.py
      - chat persistence implementation

  tests/backend/test_runtime_blueprint.py:
    covers:
      - ModelRuntime contract / llama.cpp runtime blueprint
    inspect_with:
      - backend/app/runtime/base.py
      - backend/app/runtime/llama_cpp.py

  tests/backend/test_ollama_runtime.py:
    covers:
      - Ollama health behavior
      - complete text generation happy/error paths
      - streaming text generation happy/error paths
      - empty streaming chunks skipped
      - streaming HTTP lifecycle cleanup on cancellation
      - native audio happy/error paths
      - outbound Ollama request contracts
    inspect_with:
      - backend/app/runtime/ollama.py
      - backend/app/config.py
    important_contracts:
      complete_text_response: "response"
      streaming_text_response: "choices[0].delta.content"
      audio_response: "choices[0].message.content"
      streaming_audio_response: "choices[0].delta.content"

  tests/backend/test_audio_capture.py:
    covers:
      - PipeWireRecorder start/stop lifecycle
      - WAV metadata inspection
      - SIGINT exit-code handling
      - explicit abort cleanup
      - duration-limit abort and discard
      - concurrent recording rejection
      - stop without active recording
      - missing pw-record failure cleanup
      - invalid WAV rejection and cleanup
    inspect_with:
      - backend/app/audio/capture.py
      - backend/app/config.py

  tests/backend/test_tts_blueprint.py:
    covers:
      - TTS protocol / Chatterbox blueprint
    inspect_with:
      - backend/app/tts/base.py
      - backend/app/tts/chatterbox.py

  tests/integration/test_ollama_integration.py:
    covers:
      - real configured Ollama model health
      - real complete text generation
      - real streaming text generation
      - real native audio request
    external_dependency:
      - local Ollama
      - configured Gemma model
      - tests/data/german-transcription.wav
    status: active
    known_note:
      - uses pytest integration marker
      - cancellation is intentionally not covered by real Ollama integration

  tests/integration/test_audio_capture_integration.py:
